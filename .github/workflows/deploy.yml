name: Build & deploy SEO Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Put the optional VPS secrets into env so we can use them in `if:` (GitHub
    # disallows `secrets.` directly in `if:` conditions — that caused the 0s failure).
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ secrets.VPS_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seo-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seo-agent:${{ github.sha }}

      # Optional: SSH to the VPS and redeploy — only runs if VPS_HOST is set.
      # If you don't want auto-redeploy, leave the VPS_* secrets unset.
      - name: Redeploy on VPS (optional)
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.VPS_DIR }}"
            docker compose pull
            docker compose up -d

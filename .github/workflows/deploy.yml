name: Build & deploy SEO Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seo-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seo-agent:${{ github.sha }}

      # Optional: SSH to the VPS and redeploy. Only runs if you set VPS_HOST.
      # If you'd rather pull on the VPS manually, just leave these secrets unset.
      - name: Redeploy on VPS (optional)
        if: ${{ secrets.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_DIR }}"
            docker compose pull
            docker compose up -d
